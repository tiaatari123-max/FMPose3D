
name: Running Kinematics Data Check

on:
  workflow_dispatch:

jobs:
  check-coordinates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Run coordinate quality check
        working-directory: research/running_kinematics
        run: |
          python scripts/calculate_knee_angles.py

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: running-kinematics-quality-report
          path: research/running_kinematics/data/coordinate_quality_check.csv
          if-no-files-found: warn
