name: Running Kinematics Data Check

on:
  workflow_dispatch:

jobs:
  check-coordinates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib pillow

      - name: Calculate knee angles
        run: |
          python research/running_kinematics/scripts/calculate_knee_angles.py
      - name: Calculate lower limb joint angles
        run: |
          python research/running_kinematics/scripts/calculate_lower_limb_angles.py
      - name: Extract all 17 joint coordinates and angles
        run: |
          python research/running_kinematics/scripts/extract_all_joint_kinematics.py
      - name: Create 3D running animation
        run: |
          python research/running_kinematics/scripts/animate_running.py

      - name: Upload knee angle results
        uses: actions/upload-artifact@v4
        with:
          name: running-knee-angles
          path: research/running_kinematics/data/knee_angles.csv
          if-no-files-found: error

      - name: Upload 3D running animation
        uses: actions/upload-artifact@v4
        with:
          name: running-3d-animation
          path: research/running_kinematics/data/running_3d_animation.gif
          if-no-files-found: error
      - name: Upload lower limb joint angle results
        uses: actions/upload-artifact@v4
        with:
          name: lower-limb-joint-angles
          path: research/running_kinematics/data/lower_limb_joint_angles.csv
          if-no-files-found: error
      - name: Upload all 17 joint coordinates
        uses: actions/upload-artifact@v4
        with:
          name: all-17-joint-coordinates
          path: research/running_kinematics/data/all_17_joint_coordinates.csv
          if-no-files-found: error

      - name: Upload all joint angles
        uses: actions/upload-artifact@v4
        with:
          name: all-joint-angles
          path: research/running_kinematics/data/all_joint_angles.csv
          if-no-files-found: error
