name: Running Kinematics Data Check

on:
  workflow_dispatch:

jobs:
  check-coordinates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib pillow

      - name: Calculate knee angles
        run: |
          python research/running_kinematics/scripts/calculate_knee_angles.py

      - name: Create 3D running animation
        run: |
          python research/running_kinematics/scripts/animate_running.py

      - name: Upload knee angle results
        uses: actions/upload-artifact@v4
        with:
          name: running-knee-angles
          path: research/running_kinematics/data/knee_angles.csv
          if-no-files-found: error

      - name: Upload 3D running animation
        uses: actions/upload-artifact@v4
        with:
          name: running-3d-animation
          path: research/running_kinematics/data/running_3d_animation.gif
          if-no-files-found: error
